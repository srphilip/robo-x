<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">

<title>Robo-X Interativo</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05070c}
body{font-family:Arial,Helvetica,sans-serif;color:white}
#app{position:relative;width:100%;height:100dvh;min-height:100vh;display:flex;align-items:center;justify-content:center;background:
radial-gradient(circle at 50% 48%,#182233 0,#0b1019 38%,#05070c 75%)}
#app.speaking{background:radial-gradient(circle at 50% 48%,#20344b 0,#0b1019 40%,#05070c 75%)}
.mouth-wrap{position:relative;width:min(78vw,78vh);height:min(43vw,43vh);min-width:260px;min-height:150px;display:flex;align-items:center;justify-content:center}
.mouth{
  position:relative;width:100%;height:100%;border:0;cursor:pointer;
  border-radius:50% / 42%; background:#050505;
  box-shadow:0 0 0 10px #273343,0 0 0 18px #111925,0 0 55px rgba(90,180,255,.28);
  transition:transform .15s ease,box-shadow .2s ease;
  overflow:hidden;
}
.mouth:active{transform:scale(.97)}
.mouth::before{
 content:"";position:absolute;left:7%;right:7%;top:15%;height:12%;
 background:linear-gradient(90deg,transparent,#fff 18%,#fff 82%,transparent);
 border-radius:50%;opacity:.9
}
.mouth::after{
 content:"";position:absolute;left:12%;right:12%;bottom:10%;height:11%;
 background:radial-gradient(ellipse,#d7e9ff 0 22%,transparent 24%);
 opacity:.15
}
.mouth.speaking{animation:talk .16s infinite alternate;box-shadow:0 0 0 10px #3a536c,0 0 0 18px #172330,0 0 75px rgba(80,190,255,.65)}
.sound{position:absolute;inset:-24%;border-radius:50%;border:2px solid rgba(110,205,255,.0);pointer-events:none}
.speaking .sound{animation:pulse 1s infinite}
#hint{position:absolute;bottom:max(24px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
font-size:clamp(14px,2vw,22px);opacity:.65;text-align:center;white-space:nowrap}
#status{position:absolute;top:max(18px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);
font-size:clamp(12px,1.7vw,18px);letter-spacing:.08em;text-transform:uppercase;opacity:.45}
#reset{position:absolute;right:18px;bottom:max(18px,env(safe-area-inset-bottom));width:42px;height:42px;border:1px solid #607080;
background:#111923;color:#b9c7d5;border-radius:50%;opacity:.35;font-size:18px;cursor:pointer;}
@keyframes talk{from{transform:scaleY(.88) scaleX(1)}to{transform:scaleY(1.06) scaleX(1.015)}}
@keyframes pulse{0%{transform:scale(.7);opacity:.8}100%{transform:scale(1.15);opacity:0}}
@media (orientation:portrait){
 .mouth-wrap{width:82vw;height:38vh}
}
</style>
</head>
<body>
<div id="app">
  <div id="status">Robo-X</div>
  <div class="mouth-wrap">
    <button class="mouth" id="mouth" aria-label="Falar com o Robo-X">
      <div class="sound"></div>
    </button>
  </div>
  <div id="hint">Toque na boca para falar comigo</div>
  <button id="reset" title="Reiniciar">↻</button>
</div>

// Respostas genéricas, caso a criança pergunte algo que não está mapeado
const respostasPadrao = [
  "Uau, que ideia legal! Me conte mais sobre isso, eu quero aprender.",
  "Hmm, minhas engrenagens estão girando rápido, não tinha pensado nisso! O que mais você sabe?",
  "Que pergunta inteligente! As crianças do 1º período sempre me surpreendem.[cite: 5]",
  "Bip bop! A Gentilene me ensinou a escutar com atenção. Pode falar de novo?[cite: 5]",
  "No SESIVERSO a gente aprende todo dia. Explica isso pra mim mais uma vez?"
];

// Configuração do Reconhecimento de Voz (Microfone)
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const recognition = SpeechRecognition ? new SpeechRecognition() : null;

if (recognition) {
  recognition.lang = 'pt-BR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    hint.textContent = "Estou ouvindo... Pode falar!";
    // Altera a cor da boca para indicar que está escutando
    mouth.style.boxShadow = "0 0 0 10px #702963, 0 0 0 18px #301934, 0 0 75px rgba(255, 105, 180, 0.6)";
  };

  recognition.onresult = (event) => {
    const userText = event.results[0][0].transcript;
    hint.textContent = "Entendendo...";
    mouth.style.boxShadow = ""; 
    simularIA(userText); // Chama o cérebro local
  };

  recognition.onspeechend = () => {
    recognition.stop();
    listening = false;
  };

  recognition.onerror = (event) => {
    listening = false;
    mouth.style.boxShadow = "";
    if (event.error === 'not-allowed') {
      hint.textContent = "Preciso de permissão para usar o microfone!";
    } else {
      hint.textContent = "Não entendi, toque de novo para tentar.";
    }
  };
}

// Função para controlar a animação e o texto da tela
function setSpeaking(on, textHint = "") {
  speaking = on;
  mouth.classList.toggle("speaking", on);
  app.classList.toggle("speaking", on);
  hint.textContent = on ? (textHint || "Robo-X está falando...") : "Toque na boca para falar comigo";
}

// Função nativa do navegador para converter texto em fala
function speak(text) {
  if ("speechSynthesis" in window) {
    speechSynthesis.cancel(); // Para qualquer fala anterior imediatamente
    const u = new SpeechSynthesisUtterance(text);
    window.currentUtterance = u;
    
    u.lang = "pt-BR";
    u.rate = 1.0;
    
    u.onstart = () => setSpeaking(true);
    u.onend = () => setSpeaking(false);
    u.onerror = () => setSpeaking(false);
    
    speechSynthesis.speak(u);
  } else {
    // Fallback caso o navegador não suporte voz
    setSpeaking(true);
    setTimeout(() => setSpeaking(false), Math.max(1800, text.length * 42));
  }
}

// Sistema que substitui a API externa simulando inteligência localmente
function simularIA(textoUsuario) {
  setSpeaking(true, "Processando...");
  const texto = textoUsuario.toLowerCase();
  let respostaEscolhida = null;

  for (const item of baseDeConhecimento) {
    const encontrouGatilho = item.gatilhos.some(gatilho => texto.includes(gatilho));
    if (encontrouGatilho) {
      respostaEscolhida = item.respostas[Math.floor(Math.random() * item.respostas.length)];
      break; 
    }
  }

  if (!respostaEscolhida) {
    respostaEscolhida = respostasPadrao[Math.floor(Math.random() * respostasPadrao.length)];
  }

  // Atraso de 500ms para parecer que está "pensando"
  setTimeout(() => {
    speak(respostaEscolhida);
  }, 500);
}

// Interação principal: toque na boca
mouth.addEventListener("click", () => {
  if (speaking || listening) return;
  
  if (!recognition) {
    speak("Seu navegador não suporta microfone. Tente usar o Google Chrome!");
    return;
  }
  
  try {
    recognition.start();
  } catch(e) {
    console.log("Microfone já em uso.");
  }
});

// Botão de reiniciar
document.getElementById("reset").addEventListener("click", (e) => {
  e.stopPropagation();
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  if (listening) recognition.stop();
  setSpeaking(false);
  mouth.style.boxShadow = "";
  hint.textContent = "Reiniciado! Toque para falar.";
});

// Duplo clique na tela para tela cheia (opcional para exibição)
document.addEventListener("dblclick", () => {
  if(!document.fullscreenElement) document.documentElement.requestFullscreen?.().catch(()=>{});
});
</script>
